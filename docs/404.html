<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off route · Sendline</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/cut-tracker/icon.svg" type="image/svg+xml">
<style>
  :root { --ground: #0C0D0E; --text: #F2EEE6; --text2: #8A8780; --accent: #FF5A1F; --wall: #121417; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --ground: #F3F1EC; --text: #141413; --text2: #6B685F; --accent: #E8450A; --wall: #E6E3DC; color-scheme: light; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background: var(--wall); color: var(--text); font: 400 17px/1.5 system-ui, sans-serif;
  }
  main { max-width: 34ch; }
  h1 { margin: 0 0 12px; font-size: clamp(48px, 12vw, 88px); line-height: .9; letter-spacing: -.04em; font-weight: 880; }
  p { margin: 0 0 22px; color: var(--text2); }
  a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: var(--accent); color: var(--ground); font-weight: 800; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Off route.</h1>
  <p>Nothing hangs on this hold. The page you wanted moved or never existed.</p>
  <a href="/cut-tracker/">Back to Sendline</a>
</main>
</body>
</html>
