<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sendline: the cut for climbers</title>
<meta name="description" content="The cut for climbers. Weigh in, eat the script, send the day. Offline.">
<meta property="og:title" content="Sendline: the cut for climbers">
<meta property="og:description" content="Every day is a hold on the wall. Weigh in, eat the script, send the day. Offline, no account.">
<meta property="og:image" content="https://raw.githubusercontent.com/doughknee/cut-tracker/main/store/01-wall.png">
<meta name="theme-color" content="#0C0D0E">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!--
  This page keeps itself current. On every load it reads, from the repo's main branch:
    CHANGELOG.md      the version, its date and "What's new"
    STORE_LISTING.md  the short description, the feature copy, "Get it", the contact line and the screenshot list
    store/*.png       the screenshots named in STORE_LISTING.md's Graphics section
  Update those files and push; nothing here needs editing. Only the <meta> tags above are static (link previews).
-->
<style>
  @font-face {
    font-family: "Archivo";
    src: url("https://raw.githubusercontent.com/doughknee/cut-tracker/main/app/src/main/res/font/archivo.ttf") format("truetype");
    font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
  }
  :root {
    --ground: #0C0D0E; --surface: #15171A; --hairline: #23252A; --border: #3A3D44;
    --text: #F2EEE6; --text2: #8A8780; --dim: #5A5D64;
    --accent: #FF5A1F; --on-accent: #0C0D0E; --good: #C8F55A; --good-dim: #4F5A3A;
    --freeze: #5AA9FF; --wall: #121417; --on-light-hold: #0C0D0E;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #F3F1EC; --surface: #FFFFFF; --hairline: #E3E0D8; --border: #C9C5BB;
      --text: #141413; --text2: #6B685F; --dim: #A09C92;
      --accent: #E8450A; --on-accent: #FFFFFF; --good: #4F8A0E; --good-dim: #C9DDB0;
      --freeze: #2F7FD6; --wall: #E6E3DC; --on-light-hold: #FFFFFF;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 400 17px/1.55 "Archivo", system-ui, sans-serif; }
  a { color: inherit; }
  a:focus-visible, summary:focus-visible, .shots:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  img { display: block; max-width: 100%; height: auto; }
  code { font: inherit; background: var(--surface); border: 1px solid var(--hairline); border-radius: 5px; padding: 0 5px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 700px) { .wrap { padding: 0 32px; } }

  /* Hero: the wall */
  .hero {
    background-color: var(--wall);
    background-image:
      radial-gradient(color-mix(in srgb, var(--text) 9%, transparent) 1.2px, transparent 1.7px),
      repeating-linear-gradient(135deg, transparent 0 11px, color-mix(in srgb, var(--text) 2.5%, transparent) 11px 12px);
    background-size: 30px 30px, auto;
    border-bottom: 1px solid var(--hairline);
    overflow: hidden;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 18px; }
  .mark { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 900; font-stretch: 125%; letter-spacing: .06em; font-size: 15px; }
  .mark img { width: 30px; height: 30px; }
  .top nav { display: flex; gap: 20px; font-size: 15px; color: var(--text2); }
  .top nav a { text-decoration: none; }
  .top nav a:hover { color: var(--text); }
  @media (max-width: 520px) { .top nav .opt { display: none; } }
  .hero-grid { display: grid; gap: 8px; padding-top: 24px; padding-bottom: 0; }
  @media (min-width: 920px) { .hero-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; padding-top: 32px; padding-bottom: 40px; } }
  h1 { margin: 0; font-weight: 880; font-size: clamp(60px, 12vw, 136px); line-height: .88; letter-spacing: -.045em; }
  .lede { margin: 22px 0 0; max-width: 26ch; font-size: clamp(19px, 2.1vw, 24px); line-height: 1.35; color: var(--text); }
  .cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 800; letter-spacing: .04em; text-decoration: none; font-stretch: 112%; }
  .btn:hover { filter: brightness(1.08); }
  .status { display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--accent); color: var(--text); font-weight: 650; }
  .quiet { color: var(--text2); font-size: 15px; text-decoration-color: var(--border); text-underline-offset: 4px; }
  .quiet:hover { color: var(--text); }
  .wall { width: 100%; max-height: 640px; margin: 0 auto; overflow: visible; }
  @media (max-width: 919px) { .wall { max-width: 560px; margin-top: 4px; } }

  .wall .rope { stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 0 28; fill: none; }
  .wall .day { fill: var(--text2); font-weight: 750; font-size: 30px; letter-spacing: .12em; font-stretch: 110%; }
  .wall .num { font-weight: 850; font-size: 8.4px; text-anchor: middle; dominant-baseline: central; }
  .wall .send .shape { fill: var(--good); } .wall .send .num { fill: var(--on-light-hold); }
  .wall .min .shape { fill: var(--good-dim); } .wall .min .num { fill: var(--text); }
  .wall .freeze .shape { fill: var(--freeze); } .wall .freeze .num { fill: var(--on-light-hold); }
  .wall .today .shape { fill: var(--ground); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
  .wall .today .num { fill: var(--text); }
  .wall .glow { fill: url(#glow); }
  .pop { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop .55s cubic-bezier(.2, .9, .3, 1.35) forwards; animation-delay: calc(var(--i) * 130ms + 150ms); }
  .seg { opacity: 0; animation: fade .3s ease-out forwards; animation-delay: calc(var(--i) * 130ms + 260ms); }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pop, .seg { animation: none; opacity: 1; } html { scroll-behavior: auto; } }

  /* Screens */
  .shots-band { padding-top: 56px; padding-bottom: 8px; }
  .shots { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; padding: 4px 16px 8px; margin: 0 -16px; }
  .shots::-webkit-scrollbar { display: none; }
  @media (min-width: 700px) { .shots { padding: 4px 32px 8px; margin: 0 -32px; scroll-padding-inline: 32px; } }
  .shots figure { flex: 0 0 min(68vw, 250px); margin: 0; scroll-snap-align: start; }
  @media (min-width: 1180px) { .shots figure { flex: 1 1 0; min-width: 0; } }
  .shots img { width: 100%; border-radius: 26px; border: 1px solid var(--hairline); background: var(--surface); aspect-ratio: 1080 / 2201; }
  .shots figcaption { margin-top: 14px; font-size: 15px; line-height: 1.45; color: var(--text2); }
  .shots figcaption strong { display: block; color: var(--text); font-size: 17px; font-weight: 800; }

  /* Story */
  section.wrap { padding-top: 104px; }
  @media (max-width: 699px) { section.wrap { padding-top: 72px; } }
  .statement { margin: 0; max-width: 36ch; font-weight: 700; font-size: clamp(24px, 2.8vw, 36px); line-height: 1.18; letter-spacing: -.02em; }
  .features { display: grid; gap: 34px 40px; margin-top: 56px; }
  @media (min-width: 720px) { .features { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1040px) { .features { grid-template-columns: 1fr 1fr 1fr; } }
  .features div { border-top: 2px solid var(--hairline); padding-top: 18px; }
  .features h3 { margin: 0 0 8px; font-size: 22px; font-weight: 820; letter-spacing: -.01em; }
  .features p { margin: 0; color: var(--text2); }

  .yours { margin-top: 88px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 28px; padding: clamp(28px, 5vw, 64px); display: grid; gap: 18px 56px; }
  @media (min-width: 900px) { .yours { grid-template-columns: auto 1fr; align-items: start; } }
  .yours h2 { margin: 0; font-size: clamp(56px, 9vw, 112px); line-height: .9; font-weight: 880; letter-spacing: -.045em; color: var(--good); }
  .yours p { margin: 0 0 18px; font-size: clamp(18px, 1.8vw, 21px); max-width: 44ch; }
  .links { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .links a { font-weight: 700; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 5px; }

  /* What's new */
  .new-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .new-head h2 { margin: 0; font-size: clamp(34px, 5vw, 60px); line-height: 1; font-weight: 860; letter-spacing: -.035em; }
  .new-head span { color: var(--text2); }
  .log { margin-top: 30px; border-top: 1px solid var(--hairline); }
  .log details { border-bottom: 1px solid var(--hairline); }
  .log summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 2px; font-size: 21px; font-weight: 800; }
  .log summary::-webkit-details-marker { display: none; }
  .log summary small { color: var(--text2); font-size: 15px; font-weight: 500; margin-left: auto; }
  .log summary::after { content: ""; width: 11px; height: 11px; border-right: 2px solid var(--text2); border-bottom: 2px solid var(--text2); transform: rotate(45deg) translateY(-3px); transition: transform .2s; flex: none; }
  .log details[open] summary::after { transform: rotate(-135deg) translateY(-3px); }
  .log ul { margin: 0 0 24px; padding-left: 20px; max-width: 72ch; color: var(--text2); }
  .log li { margin: 0 0 10px; }
  .log li::marker { color: var(--accent); }
  .older { margin-top: 18px; }

  footer { margin-top: 104px; padding: 36px 0 56px; border-top: 1px solid var(--hairline); color: var(--text2); font-size: 15px; }
  footer .wrap { display: grid; gap: 18px; }
  footer p { margin: 0; max-width: 70ch; }
  .fail { color: var(--text2); }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap top">
    <a class="mark" href="./"><img src="icon.svg" alt="">SENDLINE</a>
    <nav><a href="#new">What's new</a><a class="opt" href="privacy.html">Privacy</a><a class="opt" href="https://github.com/doughknee/cut-tracker">Source</a></nav>
  </div>
  <div class="wrap hero-grid">
    <div>
      <h1>Send<br>the day.</h1>
      <p class="lede" id="lede">The cut for climbers. Weigh in, eat the script, send the day. Offline.</p>
      <div class="cta"><span id="get"></span><a class="quiet" id="ver" href="#new">What's new</a></div>
    </div>
    <svg class="wall" id="wall" viewBox="0 0 1080 1000" role="img" aria-label="A week on the wall: six days logged, today at the top"></svg>
  </div>
</header>

<main>
  <div class="wrap shots-band">
    <div class="shots" id="shots" tabindex="0" aria-label="Screenshots"></div>
  </div>

  <section class="wrap" id="story">
    <p class="statement" id="statement"></p>
    <div class="features" id="features"></div>
    <div class="yours" id="yours" hidden></div>
  </section>

  <section class="wrap" id="new">
    <div class="new-head"><h2 id="new-title">What's new</h2><span id="new-date"></span></div>
    <div class="log" id="log"></div>
    <p class="older"><a class="quiet" href="https://github.com/doughknee/cut-tracker/blob/main/CHANGELOG.md">Every release</a></p>
  </section>
</main>

<footer>
  <div class="wrap">
    <p id="disclaimer"></p>
    <div class="links"><a href="privacy.html">Privacy policy</a><a href="https://github.com/doughknee/cut-tracker">Source on GitHub</a><span id="contact"></span></div>
  </div>
</footer>

<script>
(() => {
  const REPO = 'doughknee/cut-tracker';
  // On GitHub Pages read main; opened from a local checkout, read the working tree next door.
  const BASE = /github\.io$/.test(location.hostname) ? `https://raw.githubusercontent.com/${REPO}/main/` : '../';
  const BLOB = `https://github.com/${REPO}/blob/main/`;
  const $ = id => document.getElementById(id);
  const get = p => fetch(BASE + p, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.text(); });
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
  const sections = (md, mark) => {
    const out = []; let cur = null;
    for (const line of md.replace(/<!--[\s\S]*?-->/g, '').split(/\r?\n/)) {
      if (line.startsWith(mark)) out.push(cur = { title: line.slice(mark.length).trim(), lines: [] });
      else if (cur) cur.lines.push(line);
    }
    return out.map(s => ({ title: s.title, body: s.lines.join('\n').trim() }));
  };
  const paras = body => body.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const find = (list, start) => list.find(s => s.title.toLowerCase().startsWith(start.toLowerCase()));
  const fail = (el, file) => { el.innerHTML = `<span class="fail">This part did not load. <a href="${BLOB}${file}">Read it on GitHub</a>.</span>`; };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const longDate = iso => { const [y, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };

  // The wall: the visitor's last seven days as holds, today on top. Shapes are the app's four holds in its 24-unit box.
  const SHAPES = {
    jug: '<polygon points="12,1 20.6,5.14 22.72,14.45 16.77,21.91 7.23,21.91 1.28,14.45 3.4,5.14"/>',
    crimp: '<rect x="1.5" y="6" width="21" height="12" rx="6" transform="rotate(-10 12 12)"/>',
    sloper: '<path d="M1.5 20 A10.5 14 0 0 1 22.5 20 Z"/>',
    pinch: '<ellipse cx="12" cy="12" rx="7.5" ry="10.5" transform="rotate(16 12 12)"/>',
  };
  const NUM_Y = { jug: 12.4, crimp: 12, sloper: 15, pinch: 12 };
  const WEEK = [ // Rest, Off, no pick, Rest, Climb, Off, Off: the sample week the store shots were taken on.
    ['sloper', 'send', 140, 830], ['jug', 'min', 345, 740], ['pinch', 'freeze', 220, 570], ['sloper', 'send', 460, 490],
    ['crimp', 'send', 676, 372], ['jug', 'min', 876, 288], ['jug', 'today', 928, 112],
  ];
  const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  function wall() {
    const now = new Date(); let svg = '<defs><radialGradient id="glow"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient></defs>';
    for (let i = 0; i < WEEK.length - 1; i++) {
      const [, , x1, y1] = WEEK[i], [, , x2, y2] = WEEK[i + 1];
      svg += `<path class="rope seg" style="--i:${i}" d="M${x1} ${y1} L${x2} ${y2}"/>`;
    }
    WEEK.forEach(([shape, result, x, y], i) => {
      const d = new Date(now); d.setDate(now.getDate() - (WEEK.length - 1 - i));
      const k = result === 'today' ? 6.4 : 4.8, half = 12 * k;
      if (result === 'today') svg += `<circle class="glow seg" style="--i:${i}" cx="${x}" cy="${y}" r="${half * 2.2}"/>`;
      svg += `<g transform="translate(${x - half} ${y - half}) scale(${k})"><g class="pop ${result}" style="--i:${i}">` +
        `<g class="shape">${SHAPES[shape]}</g><text class="num" x="12" y="${NUM_Y[shape]}">${d.getDate()}</text></g></g>` +
        `<text class="day pop" style="--i:${i}" x="${x}" y="${y + half + 46}" text-anchor="middle">${DAYS[d.getDay()]}</text>`;
    });
    $('wall').innerHTML = svg;
  }
  wall();

  get('STORE_LISTING.md').then(md => {
    const all = sections(md, '## ');
    const short = find(all, 'Short description'); if (short) $('lede').textContent = short.body;

    const getIt = find(all, 'Get it');
    if (getIt) {
      const url = (getIt.body.match(/https:\/\/play\.google\.com\/\S+/) || [])[0];
      $('get').innerHTML = url ? `<a class="btn" href="${esc(url)}">GET IT ON GOOGLE PLAY</a>` : `<span class="status">${inline(paras(getIt.body)[0] || '')}</span>`;
    }

    const full = find(all, 'Full description');
    if (full) {
      const ps = paras(full.body);
      $('statement').textContent = ps[0];
      const feats = [], tail = [];
      for (const p of ps.slice(1)) {
        const [head, ...rest] = p.split('\n');
        if (rest.length) feats.push({ head, body: rest.join(' ') }); else tail.push(p);
      }
      const yours = feats.find(f => f.head === 'Yours');
      $('features').innerHTML = feats.filter(f => f !== yours).map(f => `<div><h3>${inline(f.head)}</h3><p>${inline(f.body)}</p></div>`).join('');
      if (yours) {
        $('yours').innerHTML = `<h2>${inline(yours.head)}</h2><div><p>${inline(yours.body)}</p><div class="links"><a href="privacy.html">Read the privacy policy</a><a href="https://github.com/${REPO}">Read the code</a></div></div>`;
        $('yours').hidden = false;
      }
      $('disclaimer').textContent = tail.join(' ');
    }

    const graphics = find(all, 'Graphics');
    const shots = graphics ? [...graphics.body.matchAll(/^\s*- `([\w.-]+\.png)`: ([^.]+)\.\s*(.*)$/gm)] : [];
    $('shots').innerHTML = shots.map(([, file, title, rest]) =>
      `<figure><img src="${BASE}store/${file}" width="1080" height="2201" loading="lazy" alt="${esc(title)}: ${esc(rest)}"><figcaption><strong>${inline(title)}</strong>${inline(rest)}</figcaption></figure>`).join('');

    const contact = find(all, 'Contact');
    const mail = contact && (contact.body.match(/[\w.+-]+@[\w-]+\.[\w.]+/) || [])[0];
    if (mail) $('contact').innerHTML = `<a href="mailto:${mail}">${mail}</a>`;
  }).catch(() => { fail($('features'), 'STORE_LISTING.md'); });

  get('CHANGELOG.md').then(md => {
    const latest = sections(md, '## ')[0];
    if (!latest) throw new Error('no release');
    const version = (latest.title.match(/^\d[\w.]*/) || [latest.title])[0];
    const date = (latest.title.match(/\d{4}-\d{2}-\d{2}/) || [])[0];
    $('new-title').textContent = `What's new in ${version}`;
    $('ver').textContent = `What's new in ${version}`;
    if (date) $('new-date').textContent = longDate(date);
    const groups = sections(latest.body, '### ');
    if (!groups.length) groups.push({ title: version, body: latest.body });
    $('log').innerHTML = groups.map((g, i) => {
      const items = [];
      for (const line of g.body.split('\n')) {
        if (/^\s*- /.test(line)) items.push(line.replace(/^\s*- /, ''));
        else if (line.trim() && items.length) items[items.length - 1] += ' ' + line.trim();
        else if (line.trim()) items.push(line.trim());
      }
      return `<details${i === 0 ? ' open' : ''}><summary>${inline(g.title)}<small>${items.length} ${items.length === 1 ? 'change' : 'changes'}</small></summary><ul>${items.map(t => `<li>${inline(t)}</li>`).join('')}</ul></details>`;
    }).join('');
  }).catch(() => fail($('log'), 'CHANGELOG.md'));
})();
</script>
</body>
</html>
